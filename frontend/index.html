<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Caregiver Assistant</title>
    
    <!-- SEMUA CSS DIKUNCI DI SINI AGAR TIDAK BERANTAKAN -->
    <style>
      :root {
          --purple: #7954b8; --purple-dark: #57368d; --purple-light: #f2edfb;
          --pink: #f5eafa; --white: #ffffff; --text: #302744; --muted: #81768f;
          --border: #e8e0f1; --green: #278765; --red: #c34e65;
          --shadow: 0 8px 24px rgba(67, 42, 105, .07);
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Arial, Helvetica, sans-serif; color: var(--text); background: #faf8fd; }
      button, input, select, textarea { font: inherit; }
      button { cursor: pointer; }
      .hidden { display: none !important; }
      button:disabled { opacity: .5; cursor: not-allowed; }

      .input-wrapper { position: relative; width: 100%; }
      .input-wrapper input { padding-right: 40px; }
      .toggle-pass { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer; background: none; border: none; color: var(--muted); display: grid; place-items: center; }
      input.input-error { border-color: var(--red) !important; background-color: #fff5f5 !important; box-shadow: 0 0 0 3px rgba(195, 78, 101, 0.1) !important; }
      .error-message { color: var(--red); font-size: 12px; font-weight: 600; margin-top: -10px; margin-bottom: 16px; display: none; }
      .error-message.show { display: block; }

      .login-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: linear-gradient(140deg, #eee4fb, #faf7ff, #f8eaf5); }
      .login-card { width: 100%; max-width: 420px; background: white; border-radius: 24px; padding: 36px; box-shadow: var(--shadow); }
      .logo { width: 64px; height: 64px; border-radius: 20px; display: grid; place-items: center; background: var(--purple-light); font-size: 32px; margin-bottom: 20px; }
      h1, h2, h3, p { margin-top: 0; }
      h1 { font-size: 25px; } h2 { font-size: 22px; } h3 { font-size: 16px; }
      p { color: var(--muted); line-height: 1.6; }
      label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 7px; }
      input, select, textarea { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 12px; background: white; color: var(--text); outline: none; margin-bottom: 16px; }
      input:focus, select:focus, textarea:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(121, 84, 184, .1); }
      textarea { min-height: 85px; resize: vertical; }

      .btn { border: none; padding: 11px 16px; border-radius: 10px; font-weight: 700; background: var(--purple-light); color: var(--purple-dark); }
      .btn-primary { background: var(--purple); color: white; }
      .btn-primary:hover { background: var(--purple-dark); }
      .btn-danger { background: #fde9ee; color: #a52d49; }
      .btn-small { padding: 7px 10px; font-size: 12px; }
      .btn-full { width: 100%; }
      .auth-switch { text-align: center; margin-top: 20px; font-size: 13px; color: var(--muted); }
      .auth-switch a, .link-btn { color: var(--purple); font-weight: 700; text-decoration: none; cursor: pointer; }

      .app-layout { min-height: 100vh; display: flex; }
      .sidebar { width: 245px; background: white; border-right: 1px solid var(--border); padding: 25px 16px; flex-shrink: 0; }
      .brand { display: flex; gap: 10px; align-items: center; padding: 0 9px 24px; font-weight: 800; line-height: 1.4; }
      .brand-icon { width: 42px; height: 42px; display: grid; place-items: center; background: var(--purple-light); border-radius: 13px; font-size: 22px; }
      .nav-label { font-size: 10px; font-weight: 800; color: #a59aae; padding: 14px 10px 8px; letter-spacing: 1.3px; }
      .nav-button { display: flex; gap: 11px; align-items: center; width: 100%; text-align: left; padding: 12px; margin: 3px 0; border: none; border-radius: 10px; color: #746781; background: transparent; text-decoration: none; }
      .nav-button:hover, .nav-button.active { background: var(--purple-light); color: var(--purple-dark); font-weight: 700; }
      .main-area { flex: 1; min-width: 0; }
      .topbar { background: white; border-bottom: 1px solid var(--border); padding: 18px 28px; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
      .topbar p { margin: 4px 0 0; font-size: 12px; }
      .user-pill { background: var(--purple-light); padding: 10px 13px; border-radius: 12px; font-size: 13px; font-weight: 700; }
      .content { padding: 28px; max-width: 1500px; margin: auto; }
      .page-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 15px; margin-bottom: 23px; }
      .page-heading p { margin-bottom: 0; }
      .stats-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-bottom: 22px; }
      .stat-card, .panel { background: white; border: 1px solid var(--border); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); }
      .stat-label { color: var(--muted); font-size: 13px; }
      .stat-number { font-size: 30px; font-weight: 800; margin: 12px 0 5px; }
      .stat-icon { font-size: 23px; }
      .dashboard-grid { display: grid; grid-template-columns: 1.2fr .8fr; gap: 18px; }
      .panel { margin-bottom: 18px; }
      .panel-heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
      .panel-heading h3 { margin-bottom: 0; }
      .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 14px; }
      .full-width { grid-column: 1 / -1; }
      .table-wrap { overflow-x: auto; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th, td { text-align: left; padding: 13px 10px; border-bottom: 1px solid #f0ebf5; vertical-align: top; }
      th { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
      td { line-height: 1.5; }
      .badge { display: inline-block; border-radius: 20px; padding: 5px 9px; background: var(--purple-light); color: var(--purple-dark); font-size: 11px; font-weight: 700; }
      .badge-green { background: #e4f6ed; color: #20744f; }
      .badge-red { background: #fde9ed; color: #a72e4a; }
      .empty { padding: 25px; text-align: center; color: var(--muted); font-size: 13px; }
      .notice { padding: 13px 15px; border-radius: 11px; background: var(--purple-light); font-size: 13px; line-height: 1.6; margin-bottom: 15px; }
      .notice.warning { background: #fff2e0; color: #885515; }
      .notice.success { background: #e8f7ef; color: #226a4b; }
      .action-row { display: flex; flex-wrap: wrap; gap: 7px; }
      .record-list { display: grid; gap: 10px; }
      .record-item { padding: 13px; border-radius: 11px; border: 1px solid var(--border); }
      .record-item strong { display: block; margin-bottom: 5px; }
      .record-item small { color: var(--muted); }

      .chat-header { background: var(--purple-light); padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
      .chat-avatar { width: 40px; height: 40px; background: var(--purple); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-size: 18px; }
      .chat-messages { flex: 1; padding: 20px; overflow-y: auto; background: #faf8fd; display: flex; flex-direction: column; gap: 12px; height: 400px; }
      .chat-bubble-ai { background: white; border: 1px solid var(--border); padding: 12px 16px; border-radius: 12px; max-width: 85%; box-shadow: 0 2px 5px rgba(0,0,0,0.02); align-self: flex-start; }
      .chat-bubble-user { background: var(--purple); color: white; padding: 12px 16px; border-radius: 12px; max-width: 85%; align-self: flex-end; box-shadow: 0 2px 5px rgba(121, 84, 184, 0.2); }
      .chat-bubble-ai p, .chat-bubble-user p { margin: 0; font-size: 14px; color: inherit; }
      .chat-bubble-user p { color: white; }
      .chat-input-area { padding: 15px; background: white; border-top: 1px solid var(--border); display: flex; gap: 10px; }
      .chat-input-area input { margin-bottom: 0; }

      footer { padding: 20px 28px; font-size: 11px; color: var(--muted); text-align: center; }
      .mobile-menu { display: none; }

      .modal-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:100; display:flex; align-items:center; justify-content:center; padding: 20px; }
      .modal-card { max-width: 420px; width: 100%; background: white; border-radius: 24px; padding: 30px; position:relative; box-shadow: var(--shadow); }
      .modal-close { position:absolute; right:15px; top:15px; background:none; border:none; font-size:20px; cursor:pointer; color: var(--muted); }

      @media (max-width: 1000px) { .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .dashboard-grid { grid-template-columns: 1fr; } }
      @media (max-width: 720px) {
          .sidebar { position: fixed; z-index: 10; top: 0; bottom: 0; left: 0; transform: translateX(-105%); transition: transform .2s ease; box-shadow: var(--shadow); }
          .sidebar.open { transform: translateX(0); }
          .mobile-menu { display: inline-block; }
          .topbar { padding: 14px; } .content { padding: 16px; } .stats-grid { gap: 10px; } .stat-card { padding: 14px; } .stat-number { font-size: 24px; }
          .form-grid { grid-template-columns: 1fr; } .full-width { grid-column: auto; } .page-heading { flex-direction: column; } .login-card { padding: 25px; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
